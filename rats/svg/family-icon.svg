<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 32" fill="none">
  <!-- Three heads symbolize a family; the UI supplies its actual member count. -->
  <defs>
    <g id="rat" stroke="#17211e" stroke-width="1.8" stroke-linejoin="round">
      <circle cx="-5.5" cy="-6" r="4.5"/>
      <circle cx="5.5" cy="-6" r="4.5"/>
      <g fill="#cb9084" stroke="none">
        <circle cx="-5.5" cy="-6" r="2.3"/>
        <circle cx="5.5" cy="-6" r="2.3"/>
      </g>
      <path d="M-6-4Q0-8 6-4Q8 0 4 5L0 9-4 5Q-8 0-6-4Z"/>
      <!-- The family's red helmet, as linked rats wear in the app. -->
      <path d="M-5.8-2.2C-5.8-8.2-3.1-10.4 0-10.4C3.1-10.4 5.8-8.2 5.8-2.2Z" fill="#ff3a2e"/>
      <rect x="-6.6" y="-3.6" width="13.2" height="2.4" rx="1.2" fill="#b8231b"/>
      <g fill="#17211e" stroke="none">
        <circle cx="-2.7" cy=".5" r="1"/>
        <circle cx="2.7" cy=".5" r="1"/>
        <ellipse cx="0" cy="6.5" rx="1.8" ry="1.3"/>
      </g>
    </g>
  </defs>
  <use href="#rat" transform="translate(10 12) scale(.86)" fill="#97a58f"/>
  <use href="#rat" transform="translate(30 12) scale(.86)" fill="#97a58f"/>
  <use href="#rat" transform="translate(20 21)" fill="#f0e5c8"/>
</svg>
